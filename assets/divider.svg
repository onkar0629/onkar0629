<svg width="1200" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D4FF"/>
    <stop offset="50%" stop-color="#58A6FF"/>
    <stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>

<filter id="glow">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
    </feMerge>
</filter>

</defs>

<!-- Left Line -->
<line
x1="40"
y1="20"
x2="540"
y2="20"
stroke="url(#dividerGradient)"
stroke-width="2"
opacity="0.8"/>

<!-- Right Line -->
<line
x1="660"
y1="20"
x2="1160"
y2="20"
stroke="url(#dividerGradient)"
stroke-width="2"
opacity="0.8"/>

<!-- Center Circle -->
<circle
cx="600"
cy="20"
r="7"
fill="#00D4FF"
filter="url(#glow)">

<animate
attributeName="r"
values="7;9;7"
dur="2.5s"
repeatCount="indefinite"/>

</circle>

<!-- Rotating Diamond -->
<rect
x="594"
y="14"
width="12"
height="12"
fill="#7C3AED"
transform="rotate(45 600 20)">

<animateTransform
attributeName="transform"
type="rotate"
from="0 600 20"
to="360 600 20"
dur="12s"
repeatCount="indefinite"/>

</rect>

<!-- Flowing Particle -->
<circle
r="3"
fill="#58A6FF">

<animateMotion
dur="6s"
repeatCount="indefinite"
path="M40 20 L1160 20"/>

</circle>

</svg>
