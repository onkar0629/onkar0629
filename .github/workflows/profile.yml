name: Generate Profile Assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile.yml"
      - "generator/**"
      - "requirements.txt"
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: onkar0629
        run: python -m generator.main

      - name: Commit generated SVG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/analytics.svg assets/streak.svg assets/divider.svg assets/footer.svg
          if git diff --cached --quiet; then
            echo "No generated asset changes."
          else
            git commit -m "chore: update generated profile assets"
            git push
          fi
